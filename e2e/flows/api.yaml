id: datadog_e2e_api
namespace: hq.datadog.e2e
tasks:
  - id: discover
    type: io.kestra.plugin.datadog.api.Operations
    tag: Roles
    method: GET
  - id: call
    type: io.kestra.plugin.datadog.api.Call
    apiKey: mock-api-key
    appKey: mock-app-key
    apiUrl: __MOCK_URL__
    operationId: ListRoles
    paginate: true
    store: true
  - id: verify
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.discover.count > 0 }}"
      - "{{ outputs.call.count == 1 }}"
      - "{{ outputs.call.uri is not empty }}"
